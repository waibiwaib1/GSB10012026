on: release

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Cache binary without version
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5
        with:
          cache-binary: true

      - name: Cache binary with version
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5
        with:
          version: v0.17.1
          cache-binary: true

      - name: Cache binary with conditional version
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5
        with:
          version: ${{ env.BUILDX_VERSION }}
          cache-binary: true

      - name: Version without cached binary
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5
        with:
          version: v0.17.1
