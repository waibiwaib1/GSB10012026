name: "Functions"
cases:
  - name: "Basic function invocation"
    test_files:
      - path: "script.sh"
        contents: |
          myfunc() {
              echo "In myfunc()."
          }
          echo "Calling myfunc()..."
          myfunc
          echo "Returned."
    args: ["./script.sh"]

  - name: "Function invocation with args"
    test_files:
      - path: "script.sh"
        contents: |
          myfunc() {
              echo "In myfunc()"
              echo "1: $1"
              echo "*: $*"
          }
          echo "Calling myfunc()..."
          myfunc a b c
          echo "Returned."
    args: ["./script.sh"]

  - name: "Function invocation with empty arg"
    stdin: |
      myfunc() {
          echo "count: ${#*}"
          echo "\$1: $1"
          echo "\$2: $2"
          echo "\$3: $3"
      }

      myfunc a b c
      myfunc a "" c

  - name: "Function definition with output redirection"
    stdin: |
      myfunc() {
          echo "In myfunc()"
      } >>./test.txt

      myfunc
      myfunc

  - name: "Function call with env variables"
    stdin: |
      myfunc() {
          echo ${myvar}
      }

      myvar="default"
      myfunc
      myvar="overridden" myfunc
      myfunc

  - name: "Function definition without braces"
    stdin: |
      myfunc()
      if true; then
        echo true
      else
        echo false
      fi

      myfunc

  - name: "Nested function definition"
    stdin: |
      outer() {
        echo "Entered outer"

        inner() {
          echo "In inner"
        }

        echo "Invoking inner"

        inner

        echo "Returning from outer"
      }

      echo "Calling outer from toplevel"
      outer

      echo "Calling inner from toplevel"
      inner

  - name: "Export function to child shell process"
    stdin: |
      myfunc() {
        echo "In myfunc()"
      }
      export -f myfunc
      bash -c myfunc

  - name: "Export function to child shell process and re-export to grandchild"
    stdin: |
      myfunc() {
        echo "In myfunc()"
      }
      export -f myfunc
      bash -c 'bash -c myfunc'

  - name: "List exported functions"
    stdin: |
      myfunc() {
        :
      }
      export -f myfunc
      export -pf
      declare -F myfunc

  - name: "Unexport function"
    stdin: |
      myfunc() {
        :
      }
      export -f myfunc
      export -fn myfunc
      export -pf
      echo "done"

  - name: "Mark function exported via declare"
    stdin: |
      myfunc() {
        :
      }
      declare -fx myfunc
      export -pf
